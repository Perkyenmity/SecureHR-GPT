
services:
  db:
    image: postgres:16
    container_name: securehr-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: securehr
    ports:
      - "5432:5432"
    volumes:
      - securehr_pgdata:/var/lib/postgresql/data

volumes:
  securehr_pgdata:
    external: true
